global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: pms-api

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: pms-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          env: production

  # Enable when node-exporter is deployed alongside Prometheus.
  # - job_name: node
  #   static_configs:
  #     - targets: ['node-exporter:9100']
