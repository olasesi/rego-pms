apiVersion: v1
kind: Service
metadata:
  name: pms-mysql
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: pms-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pms-mysql
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-mysql
spec:
  serviceName: pms-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pms-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pms-mysql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: pms-mysql-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          readinessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 20Gi
