apiVersion: v1
kind: Service
metadata:
  name: pms-redis
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-redis
spec:
  selector:
    app.kubernetes.io/name: pms-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-redis
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pms-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pms-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pms-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pms-redis-data
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-redis
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 5Gi
