apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pms
  namespace: pms
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pms.example.com
      secretName: pms-tls
  rules:
    - host: pms.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pms-api
                port:
                  number: 8000
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: pms-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: pms-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: pms-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: pms-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pms-web
                port:
                  number: 80
