apiVersion: v1
kind: Service
metadata:
  name: pms-web
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-web
spec:
  selector:
    app.kubernetes.io/name: pms-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-web
  namespace: pms
  labels:
    app.kubernetes.io/name: pms-web
    app.kubernetes.io/part-of: pms
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pms-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pms-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web
          image: ghcr.io/olasesi/rego-pms/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
